[workspace]
members = ["src-tauri"]
resolver = "2"

[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false

[profile.release.build-override]
opt-level = 0
codegen-units = 16
