[package]
name = "rust-lab"
version = "1.0.5"
description = "Learn the Rust programming language with lessons and a built-in playground"
edition = "2021"
rust-version = "1.77"

[lib]
name = "rustlab"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
ureq = { version = "2", features = ["json"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
